<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>breus-ug | Admin Panel</title>
  <style>
    :root{
      --bg:#061a2d;
      --bg-2:#0d2340;
      --line:rgba(164,213,255,0.12);
      --text:#edf8ff;
      --muted:#cfe9ff;
      --primary:#52c3ff;
      --primary-2:#00a8ff;
      --green:#3bd98c;
      --gold:#ffd166;
      --danger:#ff7a7a;
      --shadow:0 18px 42px rgba(0,0,0,0.28);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:radial-gradient(circle at top left, rgba(82,195,255,0.15), transparent 28%), linear-gradient(180deg, var(--bg), var(--bg-2));
      color:var(--text);
      line-height:1.6;
    }

    a{text-decoration:none; color:inherit}
    button,input{font:inherit}
    .container{width:min(1300px, calc(100% - 26px)); margin:0 auto}
    .topbar{
      position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
      background:rgba(7,29,49,0.72); border-bottom:1px solid var(--line);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:78px;
    }

    .brand{
      display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:0.06em; text-transform:lowercase;
    }

    .brand-mark{
      width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-weight:900;
      background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#021b2d;
      box-shadow:0 12px 24px rgba(82,195,255,0.25);
    }

    .nav-right{
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }

    .btn{
      border:none; cursor:pointer; border-radius:12px; padding:10px 15px; font-weight:700; transition:0.2s ease;
    }
    .btn:hover{ transform:translateY(-1px); }
    .btn.primary{
      background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:#041d32;
      box-shadow:0 12px 24px rgba(82,195,255,0.28);
    }
    .btn.secondary{
      background:rgba(255,255,255,0.02); color:var(--text); border:1px solid var(--line);
    }
    .btn.warn{
      background:rgba(255,209,102,0.08); color:var(--gold); border:1px solid rgba(255,209,102,0.2);
    }
    .btn.danger{
      background:rgba(255,122,122,0.08); color:var(--danger); border:1px solid rgba(255,122,122,0.2);
    }

    .page{
      padding:28px 0 40px;
    }

    .stats-grid{
      display:grid; grid-template-columns:repeat(4, minmax(180px, 1fr)); gap:18px; margin-bottom:24px;
    }

    .card{
      background:linear-gradient(180deg, rgba(23,58,92,0.86), rgba(11,29,47,0.92));
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px 18px 14px;
    }

    .card .label{
      color:var(--muted); font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
    }

    .card .value{
      font-size:2rem; font-weight:900; letter-spacing:-0.06em; margin-top:8px; color:#8ee6ff;
    }

    .card .trend{
      display:inline-flex; align-items:center; gap:8px; margin-top:10px; font-size:0.8rem; color:var(--green); font-weight:700;
    }

    .panel-grid{
      display:grid; grid-template-columns:1.2fr 0.8fr; gap:20px; margin-bottom:20px;
    }

    .panel{
      background:linear-gradient(180deg, rgba(23,58,92,0.86), rgba(11,29,47,0.92));
      border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:18px;
    }

    .panel-head{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;
    }
    .panel-head h3{ margin:0; font-size:1.2rem; }

    table{
      width:100%; border-collapse:collapse;
    }
    th,td{
      text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); font-size:0.95rem;
    }
    th{
      color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-size:0.72rem; font-weight:700;
    }
    tbody tr:last-child td{ border-bottom:none; }

    .pill{
      display:inline-block; padding:6px 10px; border-radius:999px; font-size:0.72rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    }
    .pill.success{
      color:var(--green); background:rgba(59,217,140,0.12); border:1px solid rgba(59,217,140,0.25);
    }
    .pill.pending{
      color:var(--gold); background:rgba(255,209,102,0.08); border:1px solid rgba(255,209,102,0.2);
    }
    .pill.rejected{
      color:var(--danger); background:rgba(255,122,122,0.08); border:1px solid rgba(255,122,122,0.2);
    }

    .withdraw-list{
      display:grid; gap:12px;
    }

    .withdraw-item{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    }

    .withdraw-meta{
      display:grid; gap:2px;
    }

    .withdraw-meta strong{ font-size:1rem; }
    .withdraw-meta span{ color:var(--muted); font-size:0.8rem; }

    .action-group{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }

    .purchase-list{
      display:grid; gap:12px;
    }
    .purchase-item{
      display:flex; justify-content:space-between; gap:12px; align-items:center;
      background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    }

    .purchase-item strong{ font-size:1rem; }
    .purchase-item span{ color:var(--muted); font-size:0.8rem; }

    .quick-actions{
      display:grid; grid-template-columns:repeat(2, minmax(150px, 1fr)); gap:12px; margin-top:18px;
    }

    .quick-box{
      background:rgba(255,255,255,0.02); border:1px solid var(--line); border-radius:12px; padding:14px 12px; text-align:center;
    }
    .quick-box strong{
      display:block; font-size:1.4rem; color:#8ee6ff; margin-top:8px;
    }

    @media (max-width: 980px){
      .stats-grid{ grid-template-columns:repeat(2, minmax(160px, 1fr)); }
      .panel-grid{ grid-template-columns:1fr; }
    }

    @media (max-width: 640px){
      .stats-grid{ grid-template-columns:1fr; }
      .nav{ flex-direction:column; justify-content:center; padding:14px 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">
        <div class="brand-mark">B</div>
        <span>breus-ug</span>
      </div>

      <div class="nav-right">
        <button class="btn secondary" type="button">Overview</button>
        <button class="btn secondary" type="button">Customers</button>
        <button class="btn secondary" type="button">Withdrawals</button>
        <button class="btn primary" type="button">Export</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="stats-grid">
        <div class="card">
          <div class="label">Total users</div>
          <div class="value" id="totalUsers">0</div>
          <div class="trend">▲ +12 this month</div>
        </div>

        <div class="card">
          <div class="label">Active investors</div>
          <div class="value" id="activeInvestors">0</div>
          <div class="trend">▲ +8 this week</div>
        </div>

        <div class="card">
          <div class="label">Pending withdrawals</div>
          <div class="value" id="pendingWithdrawals">0</div>
          <div class="trend">▲ awaiting action</div>
        </div>

        <div class="card">
          <div class="label">Revenue</div>
          <div class="value" id="totalRevenue">UGX 0</div>
          <div class="trend">▲ this month</div>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel">
          <div class="panel-head">
            <h3>Users</h3>
            <button class="btn secondary" type="button">View all</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>Phone</th>
                <th>Balance</th>
                <th>Daily earnings</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Quick actions</h3>
          </div>

          <div class="quick-actions">
            <div class="quick-box">
              <span>Approved</span>
              <strong id="approvedCount">0</strong>
            </div>

            <div class="quick-box">
              <span>Rejected</span>
              <strong id="rejectedCount">0</strong>
            </div>

            <div class="quick-box">
              <span>Investors</span>
              <strong id="investorCount">0</strong>
            </div>

            <div class="quick-box">
              <span>Sales</span>
              <strong id="salesCount">0</strong>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-grid">
        <div class="panel">
          <div class="panel-head">
            <h3>Withdrawal requests</h3>
            <button class="btn secondary" type="button">Refresh</button>
          </div>

          <div id="withdrawList" class="withdraw-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Recent purchases</h3>
          </div>

          <div id="purchaseList" class="purchase-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEYS = {
      users: "breusug_users",
      withdrawals: "breusug_withdrawals",
      purchases: "breusug_purchases"
    };

    function money(value) {
      return "UGX " + Number(value || 0).toLocaleString();
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.users) || "[]");
    }

    function getWithdrawals() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.withdrawals) || "[]");
    }

    function getPurchases() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.purchases) || "[]");
    }

    function renderStats() {
      const users = getUsers();
      const withdrawals = getWithdrawals();
      const purchases = getPurchases();

      const totalUsers = users.length;
      const activeInvestors = users.filter(u => Number(u.balance) > 0).length;
      const pendingWithdrawals = withdrawals.filter(w => w.status === "Waiting for approval").length;
      const approvedCount = withdrawals.filter(w => w.status === "Approved").length;
      const rejectedCount = withdrawals.filter(w => w.status === "Rejected").length;

      const totalRevenue = purchases.reduce((sum, item) => sum + Number(item.amount || 0), 0);

      document.getElementById("totalUsers").textContent = totalUsers;
      document.getElementById("activeInvestors").textContent = activeInvestors;
      document.getElementById("pendingWithdrawals").textContent = pendingWithdrawals;
      document.getElementById("totalRevenue").textContent = money(totalRevenue);

      document.getElementById("approvedCount").textContent = approvedCount;
      document.getElementById("rejectedCount").textContent = rejectedCount;
      document.getElementById("investorCount").textContent = activeInvestors;
      document.getElementById("salesCount").textContent = purchases.length;
    }

    function renderUsers() {
      const users = getUsers();
      const body = document.getElementById("usersTableBody");

      if (!users.length) {
        body.innerHTML = `
          <tr>
            <td colspan="4" style="color: var(--muted); text-align:center; padding:16px;">No users found</td>
          </tr>
        `;
        return;
      }

      body.innerHTML = users.map(user => {
        const status = Number(user.balance) > 0 ? "Active" : "Inactive";
        return `
          <tr>
            <td>${user.phone}</td>
            <td>${money(user.balance)}</td>
            <td>${money(user.dailyEarnings)}</td>
            <td><span class="pill ${status === "Active" ? "success" : "rejected"}">${status}</span></td>
          </tr>
        `;
      }).join("");
    }

    function renderWithdrawals() {
      const withdrawals = getWithdrawals();
      const container = document.getElementById("withdrawList");

      if (!withdrawals.length) {
        container.innerHTML = `
          <div class="withdraw-item">
            <div class="withdraw-meta">
              <strong>No withdrawal requests</strong>
              <span>All clear</span>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = withdrawals.map((item, index) => {
        let statusClass = "pending";
        if (item.status === "Approved") statusClass = "success";
        if (item.status === "Rejected") statusClass = "rejected";

        const actions = item.status === "Waiting for approval"
          ? `
            <div class="action-group">
              <button class="btn primary" data-action="approve" data-index="${index}">Approve</button>
              <button class="btn danger" data-action="reject" data-index="${index}">Reject</button>
            </div>
          `
          : `
            <span class="pill ${statusClass}">${item.status}</span>
          `;

        return `
          <div class="withdraw-item">
            <div class="withdraw-meta">
              <strong>${money(item.amount)}</strong>
              <span>${item.name} • ${item.phone}</span>
              <span>${item.createdAt || "Just now"}</span>
            </div>
            ${actions}
          </div>
        `;
      }).join("");

      document.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", function () {
          const action = this.dataset.action;
          const index = Number(this.dataset.index);

          if (action === "approve") {
            approveWithdrawal(index);
          } else if (action === "reject") {
            rejectWithdrawal(index);
          }
        });
      });
    }

    function renderPurchases() {
      const purchases = getPurchases();
      const container = document.getElementById("purchaseList");

      if (!purchases.length) {
        container.innerHTML = `
          <div class="purchase-item">
            <div>
              <strong>No purchases yet</strong>
              <span>Customer activity will show here</span>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = purchases.slice(0, 6).map(item => `
        <div class="purchase-item">
          <div>
            <strong>${item.product}</strong>
            <span>${item.status}</span>
          </div>
          <strong>${money(item.amount)}</strong>
        </div>
      `).join("");
    }

    function approveWithdrawal(index) {
      const withdrawals = getWithdrawals();
      const item = withdrawals[index];
      if (!item) return;

      item.status = "Approved";
      localStorage.setItem(STORAGE_KEYS.withdrawals, JSON.stringify(withdrawals));

      if (item.phone) {
        const users = getUsers();
        const user = users.find(u => u.phone === item.phone);
        if (user) {
          user.balance = Math.max(0, Number(user.balance) - Number(item.amount || 0));
          localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(users));
        }
      }

      renderAll();
    }

    function rejectWithdrawal(index) {
      const withdrawals = getWithdrawals();
      const item = withdrawals[index];
      if (!item) return;

      item.status = "Rejected";
      localStorage.setItem(STORAGE_KEYS.withdrawals, JSON.stringify(withdrawals));
      renderAll();
    }

    function renderAll() {
      renderStats();
      renderUsers();
      renderWithdrawals();
      renderPurchases();
    }

    renderAll();
  </script>
</body>
</html>
